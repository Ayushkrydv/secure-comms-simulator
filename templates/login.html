<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Comms — Login</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  body { background: #0a0f1e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { background: #111827; border: 1px solid #1e3a5f; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 0 40px rgba(0,100,255,0.15); }
  .brand { text-align: center; margin-bottom: 2rem; }
  .brand h1 { color: #00d4ff; font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.2rem; }
  .brand p { color: #64748b; font-size: 0.78rem; letter-spacing: 1px; }
  .shield { font-size: 3rem; display: block; text-align: center; margin-bottom: 0.5rem; }
  .form-label { color: #94a3b8; font-size: 0.82rem; letter-spacing: 0.5px; }
  .form-control { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; }
  .form-control:focus { background: #1e293b; border-color: #00d4ff; color: #fff; box-shadow: 0 0 0 2px rgba(0,212,255,0.2); }
  .btn-secure { background: #00d4ff; color: #0a0f1e; font-weight: 700; letter-spacing: 1px; border: none; width: 100%; padding: 0.7rem; border-radius: 6px; }
  .btn-secure:hover { background: #00b8d9; color: #0a0f1e; }
  .footer-note { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.72rem; letter-spacing: 0.5px; }
  .alert { font-size: 0.85rem; }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <span class="shield">🛡️</span>
    <h1>Secure Comms Simulator</h1>
    <p>TACTICAL COMMUNICATION SYSTEM — TRAINING USE ONLY</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="mb-3">
      <label class="form-label">USERNAME</label>
      <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label">PASSWORD</label>
      <input type="password" name="password" class="form-control" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn btn-secure">AUTHENTICATE</button>
  </form>

  <div class="footer-note">
    SIMULATED ENVIRONMENT — FICTIONAL PERSONNEL ONLY<br>
    Unauthorised access is prohibited.
  </div>
</div>
</body>
</html>
